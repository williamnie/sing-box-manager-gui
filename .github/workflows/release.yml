name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Test backend
        run: go test ./...

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          mkdir -p dist

          for os in linux darwin; do
            for arch in amd64 arm64; do
              output="dist/sbm-${os}-${arch}"
              echo "Building ${os}/${arch}..."
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
                -ldflags "-s -w -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME} -X main.GitCommit=${GITHUB_SHA}" \
                -o "$output" ./cmd/sbm/
            done
          done

          for arch in amd64 arm64; do
            echo "Building Linux gateway helper/${arch}..."
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -ldflags "-s -w" \
              -o "dist/sbm-gateway-linux-${arch}" ./cmd/sbm-gateway/
          done

          cp scripts/install-gateway.sh dist/
          jq -n \
            --arg version "$VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg build_time "$BUILD_TIME" \
            --arg go_version "$(go version)" \
            --arg workflow_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{version: $version, commit: $commit, build_time: $build_time, go_version: $go_version, workflow_url: $workflow_url}' \
            > dist/build-info.json
          (cd dist && sha256sum sbm-* install-gateway.sh build-info.json > SHA256SUMS)

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
